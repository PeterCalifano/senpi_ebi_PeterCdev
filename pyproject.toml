[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "senpi"
version = "0.1.0"
description = "Synthetic Events Through Neural Processing and Integration — event camera simulation and processing"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "kornia>=0.7",
    "Pillow>=10.0",
    "opencv-python>=4.8",
    "tqdm>=4.60",
    "seaborn>=0.12",
    "h5py>=3.8",
    "dv>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["senpi*"]
